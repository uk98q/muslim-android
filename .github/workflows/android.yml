name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          cp "$APK" Muslim-v1.3-android.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell monkey -p com.uk98q.muslim -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.uk98q.muslim
            adb shell dumpsys window windows | grep -E "mCurrentFocus" | tee focus.txt
            grep -q "com.uk98q.muslim" focus.txt
            adb logcat -d | grep -E "FATAL EXCEPTION|com.uk98q.muslim.*Exception" > crash.txt || true
            if [ -s crash.txt ]; then echo "Crash found:"; cat crash.txt; exit 1; fi
            adb exec-out screencap -p > emulator-home.png
            echo "Smoke test passed"

      - name: Upload screenshot and APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-android
          path: |
            Muslim-v1.3-android.apk
            emulator-home.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.3-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Muslim-v1.3-android.apk emulator-home.png \
            --repo "$GITHUB_REPOSITORY" \
            --title "مسلم Android 1.3 (run ${GITHUB_RUN_NUMBER})" \
            --notes "نسخة أندرويد من تطبيق مسلم. ملف APK موقّع بمفتاح ذاتي للتثبيت المباشر. تم اختبار التشغيل على محاكي Android 14 قبل النشر."
          echo "$TAG" > release-tag.txt
