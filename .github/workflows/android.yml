name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          cp "$APK" Muslim-v1.4-android.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test and Quran playback test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.uk98q.muslim android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.uk98q.muslim android.permission.ACCESS_COARSE_LOCATION || true
            adb logcat -c
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell monkey -p com.uk98q.muslim -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.uk98q.muslim | tee pid.txt
            test -s pid.txt
            adb logcat -d > logcat.txt || true
            grep -E "FATAL EXCEPTION" logcat.txt > crash.txt || true
            if [ -s crash.txt ]; then echo "Crash found:"; cat crash.txt; exit 1; fi
            adb exec-out screencap -p > emulator-home.png
            echo "Smoke test passed"

            # Network probe from inside the emulator (diagnostic; does not fail the build)
            adb shell "toybox wget -q -O /dev/null --timeout=20 https://everyayah.com/data/Alafasy_128kbps/001001.mp3; echo wget_exit=\$?" || true

            # Quran: open Al-Fatiha, autoplay from ayah 1, and expect ayah 2 to start after ayah 1 ends.
            adb shell am force-stop com.uk98q.muslim
            adb logcat -c
            adb shell am start -n com.uk98q.muslim/.MainActivity --ei surah 1 --ez autoplay true
            sleep 60
            adb logcat -d > logcat-quran.txt || true
            adb exec-out screencap -p > quran-reader.png || true
            adb shell pidof com.uk98q.muslim || echo "app not running"
            adb shell dumpsys activity top | grep -E "ACTIVITY|mFocused" | head -5 || true
            adb logcat -d -s MuslimQuran:I MuslimQuran:W MediaPlayer:W MediaPlayer:E AndroidRuntime:E > quran-log.txt || true
            echo "--- MuslimQuran and media lines ---"
            cat quran-log.txt || true
            echo "--- crash lines ---"
            grep -A8 "FATAL EXCEPTION" logcat-quran.txt || echo "no crash"
            grep -q "started 1:1" quran-log.txt
            grep -q "started 1:2" quran-log.txt
            adb exec-out screencap -p > quran-reader.png
            echo "Quran playback test passed"

      - name: Upload screenshots and APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-android
          path: |
            Muslim-v1.4-android.apk
            emulator-home.png
            quran-reader.png
            quran-log.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.4-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Muslim-v1.4-android.apk emulator-home.png quran-reader.png quran-log.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "مسلم Android 1.4 (run ${GITHUB_RUN_NUMBER})" \
            --notes "نسخة أندرويد من تطبيق مسلم 1.4 مع القرآن الكريم (رواية حفص) والتفسير والتلاوة. ملف APK موقّع بمفتاح ذاتي للتثبيت المباشر. تم اختبار التشغيل على محاكي Android 14 قبل النشر."
          echo "$TAG" > release-tag.txt
