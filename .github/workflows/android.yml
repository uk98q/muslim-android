name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          cp "$APK" Muslim-v1.7-android.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test and mushaf page 2 tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.uk98q.muslim android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.uk98q.muslim android.permission.ACCESS_COARSE_LOCATION || true
            adb logcat -c
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell monkey -p com.uk98q.muslim -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.uk98q.muslim | tee pid.txt
            test -s pid.txt
            adb logcat -d > logcat.txt || true
            grep -E "FATAL EXCEPTION" logcat.txt > crash.txt || true
            if [ -s crash.txt ]; then echo "Crash found:"; cat crash.txt; exit 1; fi
            adb exec-out screencap -p > emulator-home.png
            adb shell input swipe 540 1900 540 1000 400
            sleep 3
            adb exec-out screencap -p > home-daily-section.png
            echo "Smoke test passed"

            # Test 1: page 2 (Al-Baqarah), Yasser Al-Dosari (index 5), autoplay, tafsir panel OPEN.
            adb shell am force-stop com.uk98q.muslim
            adb logcat -c
            adb shell am start -n com.uk98q.muslim/.MainActivity --ei page 2 --ei reciter 5 --ez autoplay true --ez tafsir true --ez tafsirOpen true
            sleep 50
            adb exec-out screencap -p > mushaf-page-2-tafsir-open.png || true
            adb logcat -d > logcat-open.txt || true
            grep -E "MuslimQuran|MediaPlayer|AndroidRuntime|com.uk98q" logcat-open.txt > quran-log-open.txt || true
            cat quran-log-open.txt || true
            grep -A8 "FATAL EXCEPTION" logcat-open.txt && exit 1 || echo "no crash (open)"
            grep -q "Yasser_Ad-Dussary_128kbps" quran-log-open.txt
            grep -q "started 2:1" quran-log-open.txt
            adb shell pidof com.uk98q.muslim
            echo "Page 2 tafsir-open test passed"

            # Test 2: same page, tafsir panel CLOSED (collapsed header only).
            adb shell am force-stop com.uk98q.muslim
            adb logcat -c
            adb shell am start -n com.uk98q.muslim/.MainActivity --ei page 2 --ei reciter 5 --ez autoplay true --ez tafsir true --ez tafsirOpen false
            sleep 50
            adb exec-out screencap -p > mushaf-page-2-tafsir-closed.png || true
            adb logcat -d > logcat-closed.txt || true
            grep -A8 "FATAL EXCEPTION" logcat-closed.txt && exit 1 || echo "no crash (closed)"
            adb shell pidof com.uk98q.muslim
            echo "Page 2 tafsir-closed test passed"

            adb logcat -d > logcat-full.txt || true
            grep -E "MuslimQuran|MediaPlayer|AndroidRuntime|com.uk98q" logcat-full.txt > quran-log.txt || true

      - name: Upload screenshots and APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-android
          path: |
            Muslim-v1.7-android.apk
            emulator-home.png
            home-daily-section.png
            mushaf-page-2-tafsir-open.png
            mushaf-page-2-tafsir-closed.png
            quran-log.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.7-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Muslim-v1.7-android.apk emulator-home.png home-daily-section.png mushaf-page-2-tafsir-open.png mushaf-page-2-tafsir-closed.png quran-log.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "مسلم Android 1.7 (run ${GITHUB_RUN_NUMBER})" \
            --notes "نسخة أندرويد من مسلم 1.7: تفسير لا يغطي الآيات مع زر إخفاء وإظهار، وتوزيع متساوٍ للفراغات بين الكلمات، وخط أميري قرآن (SIL OFL). ملف APK موقّع بمفتاح ذاتي للتثبيت المباشر."
          echo "$TAG" > release-tag.txt
